<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DARVÉ Cart</title>
	<link rel="icon" type="image/png" href="Images/logo2.png">
	<link rel="stylesheet" href="style.css?v=3">
	<link rel="stylesheet" href="admin.css">
</head>

<body>
	<header class="navbar">
		<div class="nav-container">
			<a href="index.html" class="logo">
				<img src="Images/logo2.png" alt="DARVÉ Logo">
			</a>
			<nav class="nav-menu">
				<a href="index.html" class="nav-link">Store</a>
				<a href="index.html#products" class="nav-link">Products</a>
				<a href="cart.html" class="cart-link" aria-current="page">
					Cart
					<span id="cartCount">0</span>
				</a>
			</nav>
		</div>
	</header>

	<main class="cart-page">
		<div class="products-header">
			<span class="section-subtitle">YOUR DARVÉ SELECTION</span>
			<h1>View Your <span>Cart</span></h1>
			<p>Review your selected pieces before completing your order.</p>
		</div>

		<section class="cart-panel" aria-label="Shopping cart">
			<div id="cartItems"></div>
			<div id="cartTotal"></div>
		</section>

		<a href="index.html#products" class="about-button">Continue Shopping <span>→</span></a>
	</main>

	<script src="js/cart.js"></script>
	<script src="js/cart-page.js"></script>
</body>

</html>
